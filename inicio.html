<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style2.css" />
    <title>Inicio</title>
  </head>

  <body>
    <button id="add-grave" class="btn">Crear lápida</button>
    <div class="container-de-todo">
      <main class="main-content-derecha"></main>
      <section class="river" id="camino">
        <button id="avanzar"></button>
        <button id="devolverse"></button>
      </section>
      <main class="main-content-izquierda"></main>
    </div>

    <div class="niebla capa1"></div>
    <div class="niebla capa2"></div>

    <form id="grave-form" class="hide">
        <div class="form-group">
            <label for="grave-text">Mensaje de la lápida:</label>
            <input type="text" id="grave-text" required placeholder="Aquí yace..." />
        </div>
        <div class="form-group">
             <label for="author-name">Nombre del autor</label>
            <input type="text" id="author-name" required placeholder="nombre del autor">
        </div>
      
     <div class="form-group">
            <label for="derechos">Desea tener derechos de autor?</label>
      <input type="checkbox" name="derechos" id="derechos-autor">
 
     </div>
  
      <button type="submit" class="btn">Agregar</button>
    </form>
  </body>
  <script src="./script.js"></script>
</html>
