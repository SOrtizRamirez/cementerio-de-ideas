<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style2.css" />
  <title>Inicio</title>
</head>

<body>
  <button class="add-grave">Crear lápida</button>
  <div class="container-de-todo">
    <main class="main-content-derecha"></main>
    <section class="river">
      <button id="avanzar"></button>
      <button id="devolverse"></button>
    </section>
    <main class="main-content-izquierda"></main>
  </div>

  <div class="fog fog-front"></div>
  <div class="fog fog-back"></div>

  <form id="grave-form" class="hide">
    <label for="grave-text">Mensaje de la lápida:</label>
    <input type="text" id="grave-text" required placeholder="Aquí yace..." />
    <button type="submit">Agregar</button>
  </form>

  <div class="lapida">
    <img src="lapida.png" alt="Lápida">
    <img class="flores" src="/mnt/data/flowers3.png" alt="Flores">
    <div class="acciones">
      <button onclick="florecer(this)">💗 Like</button>
      <button onclick="florecer(this)">🤝 Apoyo</button>
    </div>
  </div>
</body>
<script src="./script.js"></script>

</html>
