<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido al Cementerio de Ideas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" id="welcome-screen">
        <h1>Bienvenido al Cementerio de Ideas</h1>
        <button id="start-button">Entrar</button>
    </div>
    <!-- LOGIN FORM -->
    <div class="container hidden" id="login-screen">
        <h2>Acceso al Santuario</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Nombre:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>
        <p>¿Aún no te has registrado? <a href="#" id="register-link">Registrarse</a></p>
    </div>
    <!-- REGISTER FORM -->
    <div class="container hidden" id="register-screen">
    <h2>Registro de Nuevo Usuario</h2>
    <form id="register-form">
        <div class="input-group">
            <label for="new-username">Nombre Completo:</label>
            <input type="text" id="new-username" name="new-username" required>
        </div>
         <div class="input-group">
            <label for="new-email">Email:</label>
            <input type="email" id="new-email" name="new-email" required>
        </div>
        <div class="input-group">
            <label for="new-password">Contraseña:</label>
            <input type="password" id="new-password" name="new-password" required>
        </div>
        <div class="input-group">
            <label for="confirm-password">Confirmar Contraseña:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
        </div>
        <button type="submit">Registrar</button>
    </form>
    <p>¿Ya tienes una cuenta? <a href="#" id="login-link">Iniciar Sesión</a></p>
</div>

    <script src="script.js"></script>
</body>
</html>
